<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 팀 오락실 - 멀티플레이</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#4a3b5c;--sub:#8a7a9b;--line:#ffcf99;--pop:#ff8fab;--ok:#7ed957;--alt:#6ec6ff}
body{background:var(--bg);background-image:radial-gradient(var(--line) 2px,transparent 2px);background-size:26px 26px;color:var(--ink);font-family:"Jua",sans-serif;text-align:center;margin:0;padding:15px;touch-action:manipulation}
#app{max-width:700px;margin:0 auto;padding:10px}
h1{font-size:2.2rem;margin:10px 0}
.card{background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 6px 0 var(--ink)}
.btn{font:inherit;font-size:1.2rem;border:4px solid var(--ink);background:var(--pop);color:#fff;border-radius:20px;padding:12px 20px;cursor:pointer;margin:6px;box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,0.2)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.ok{background:var(--ok)}.btn.alt{background:var(--alt)}.btn.big{font-size:1.5rem;padding:16px 24px;width:100%;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.team{border-radius:20px;padding:12px;border:4px solid var(--ink);color:#fff;text-align:left;font-size:1.1rem;text-shadow:0 2px 0 rgba(0,0,0,0.2)}
.team b{display:block;font-size:1.5rem;text-align:center}
.team .plist{margin-top:8px;font-size:0.95rem;background:rgba(0,0,0,0.15);border-radius:12px;padding:6px;min-height:44px}
.member-tag{display:inline-block;background:rgba(255,255,255,0.3);border-radius:8px;padding:2px 6px;margin:2px}
.pick{opacity:0.5;cursor:pointer}.pick.on{opacity:1;transform:scale(1.04);border-width:5px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;text-align:left}
.bar .nm{width:110px;flex:none;font-size:1.1rem}
.bar .tr{flex:1;background:rgba(0,0,0,0.08);border-radius:99px;height:28px;overflow:hidden;border:3px solid var(--ink)}
.bar .fl{height:100%;border-radius:99px;transition:width .3s}
.bar .v{width:70px;text-align:right;font-weight:700}
.huge{font-size:5rem;margin:15px 0}
input{font:inherit;font-size:1.3rem;border:3px solid var(--ink);border-radius:16px;padding:10px;width:80%;text-align:center;background:var(--card);color:var(--ink)}
.pad{height:45vh;width:100%;font-size:2.5rem;border:4px solid var(--ink);background:var(--pop);color:#fff;border-radius:24px;cursor:pointer;box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,0.2)}
.pad:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
.sub{color:var(--sub);font-size:1.1rem;margin-bottom:12px}
.badge{background:#4a3b5c;color:#fff;border-radius:14px;padding:6px 14px;font-size:1.2rem;display:inline-block;border:3px solid var(--ink)}
#qr-box{display:flex;justify-content:center;margin:12px 0}
#qr-box img,#qr-box canvas{border:4px solid var(--ink);border-radius:16px;padding:8px;background:#fff}
</style>
</head>
<body>
<div id="app"><div style="margin-top:50px;"><h1>🎈 멀티플레이 오락실</h1><p class="sub">서버 연결 중...</p></div></div>

<script>
const socket = io();
const T = [["🐰","토끼팀","#ff8fab"],["🐻","곰팀","#ffb347"],["🐸","개구리팀","#6fcf4f"],["🐧","펭귄팀","#5bb8f5"]];
const G = {
  tap: {n:"연타왕", e:"👆", d:10, h:"10초 동안 빠르게 연타하세요!"},
  stop:{n:"10초 멈춰라", e:"⏱️", d:14, h:"3초 뒤 암전! 정확히 10초에 STOP!"}
};

const app = document.getElementById("app");
const draw = html => { app.innerHTML = html; };
const urlParams = new URLSearchParams(location.search);
const qRoomCode = urlParams.get("room");

let isHost = false, currentRoom = null, pInfo = { name: "", team: null }, pTimer = null, pStopped = false, pT0 = 0;

if(qRoomCode) {
  renderPlayerSetup(qRoomCode);
} else {
  renderHome();
}

socket.on("ROOM_CREATED", ({ roomCode }) => {
  currentRoom = { roomCode, players: {}, scores: {}, ph: "lobby" };
  renderHostView();
});

socket.on("STATE_UPDATE", (room) => {
  currentRoom = room;
  if(isHost) renderHostView();
  else renderPlayerStateView();
});

socket.on("LIVE_SCORE_UPDATE", ({ scores }) => {
  if(currentRoom && isHost && currentRoom.ph === "play") {
    currentRoom.scores = scores;
    renderHostView();
  }
});

socket.on("JOIN_SUCCESS", () => { renderPlayerWaitScreen("입장 완료! 진행자가 게임을 고르길 기다려주세요 🎈"); });
socket.on("ERROR_MSG", (msg) => { alert(msg); renderHome(); });

function renderHome(){
  draw(`
    <h1>🎈 우리집 팀 오락실</h1>
    <p class="sub">TV와 스마트폰을 연결하여 즐기는 실시간 멀티플레이!</p>
    <div class="card">
      <h2>🎤 큰 화면 (진행자 / TV)</h2>
      <button class="btn big ok" id="btn-create">방 만들기</button>
    </div>
    <div class="card">
      <h2>📱 스마트폰 (참가자)</h2>
      <input type="text" id="code-input" placeholder="4자리 방 코드" maxlength="4"><br><br>
      <button class="btn big alt" id="btn-manual">방 코드로 입장</button>
    </div>
  `);
  document.getElementById("btn-create").onclick = () => { isHost = true; socket.emit("HOST_CREATE_ROOM"); };
  document.getElementById("btn-manual").onclick = () => {
    const code = document.getElementById("code-input").value.trim();
    if(code.length !== 4) return alert("4자리 방 코드를 입력하세요.");
    renderPlayerSetup(code);
  };
}

function renderHostView(){
  if(!currentRoom) return;
  if(currentRoom.ph === "count") return draw(`<h1>${G[currentRoom.g].e} ${G[currentRoom.g].n}</h1><p class="sub">준비하세요!</p><div class="huge">${currentRoom.n}</div>`);
  if(currentRoom.ph === "play") return draw(`<h1>${G[currentRoom.g].e} ${G[currentRoom.g].n}</h1><div class="card"><h2>⏳ 남은 시간: ${Math.max(0, currentRoom.left)}초</h2>${renderBars(currentRoom.g)}</div>`);
  if(currentRoom.ph === "result") {
    draw(`<h1>🎉 경기 결과</h1><div class="card">${renderBars(currentRoom.g)}</div><button class="btn ok big" id="btn-next" style="margin-top:15px;">다음 게임 선택 ▶</button>`);
    document.getElementById("btn-next").onclick = () => { currentRoom.ph = "lobby"; renderHostView(); };
    return;
  }

  const pCount = Object.keys(currentRoom.players || {}).length;
  const roster = T.map((t, idx) => {
    const m = Object.values(currentRoom.players || {}).filter(p => p.team === idx);
    const list = m.map(x => `<span class="member-tag">🟢 ${x.name}</span>`).join("") || `<span style="font-size:0.85rem;color:#8a7a9b">대기 중...</span>`;
    return `<div class="team" style="background:${t[2]}"><b>${t[0]} ${t[1]} (${m.length}명)</b><div class="plist">${list}</div></div>`;
  }).join("");

  const joinUrl = `${location.origin}${location.pathname}?room=${currentRoom.roomCode}`;
  draw(`
    <h1>🎈 진행자 대기실</h1>
    <div class="badge">방 코드: ${currentRoom.roomCode} | 접속 인원: ${pCount}명</div>
    <div class="card">
      <h2>📱 QR 스캔하여 참가</h2>
      <div id="qr-box"></div>
      <p class="sub" style="font-size:0.9rem;word-break:break-all;">${joinUrl}</p>
    </div>
    <h2>👥 팀별 참가자 현황</h2>
    <div class="grid">${roster}</div>
    <h2 style="margin-top:15px;">🎮 시작할 게임 선택</h2>
    <div class="grid">${Object.entries(G).map(([k, g]) => `<button class="btn big start-btn" data-g="${k}">${g.e} ${g.n}</button>`).join("")}</div>
  `);

  const qrBox = document.getElementById("qr-box");
  if(qrBox){ qrBox.innerHTML = ""; new QRCode(qrBox, { text: joinUrl, width: 140, height: 140 }); }

  document.querySelectorAll(".start-btn").forEach(btn => {
    btn.onclick = () => { socket.emit("HOST_START_GAME", { roomCode: currentRoom.roomCode, gKey: btn.dataset.g, duration: G[btn.dataset.g].d }); };
  });
}

function renderBars(gKey){
  const r = T.map((_, i) => {
    const m = Object.entries(currentRoom.players || {}).filter(([_, p]) => p.team === i);
    if(!m.length) return [i, null];
    const sum = m.reduce((acc, [pId]) => acc + (currentRoom.scores[pId] ?? (gKey === "stop" ? 10 : 0)), 0);
    return [i, sum / m.length];
  }).filter(x => x[1] !== null).sort((a,b) => gKey === "stop" ? a[1]-b[1] : b[1]-a[1]);

  if(!r.length) return `<p class="sub">참가팀 대기 중...</p>`;
  const maxV = Math.max(1, ...r.map(x => gKey === "stop" ? 10 : x[1]));
  return r.map((x, idx) => {
    const t = T[x[0]];
    const w = gKey === "stop" ? Math.max(8, 100 - x[1]*10) : Math.max(8, (x[1]/maxV)*100);
    const txt = gKey === "stop" ? x[1].toFixed(2) + "초 차이" : Math.round(x[1]) + "점";
    return `<div class="bar"><span class="nm">${idx===0?"👑 ":""}${t[0]} ${t[1]}</span><div class="tr"><div class="fl" style="width:${w}%;background:${t[2]}"></div></div><span class="v">${txt}</span></div>`;
  }).join("");
}

function renderPlayerSetup(code){
  draw(`
    <h1>📱 참가자 등록</h1>
    <div class="badge">방 코드: ${code}</div>
    <div class="card">
      <input type="text" id="p-name" placeholder="닉네임 (예: 아빠)" maxlength="8"><br><br>
      <h2>팀을 선택하세요</h2>
      <div class="grid">${T.map((t, i) => `<div class="team pick" data-t="${i}" style="background:${t[2]}"><b>${t[0]} ${t[1]}</b></div>`).join("")}</div><br>
      <button class="btn ok big" id="btn-p-join">입장하기 🚀</button>
    </div>
  `);
  document.querySelectorAll(".pick").forEach(el => {
    el.onclick = () => { pInfo.team = parseInt(el.dataset.t); document.querySelectorAll(".pick").forEach(x => x.classList.toggle("on", x === el)); };
  });
  document.getElementById("btn-p-join").onclick = () => {
    pInfo.name = document.getElementById("p-name").value.trim();
    if(!pInfo.name) return alert("닉네임을 입력하세요.");
    if(pInfo.team === null) return alert("팀을 선택해 주세요.");
    socket.emit("PLAYER_JOIN", { roomCode: code, name: pInfo.name, team: pInfo.team });
  };
}

function renderPlayerWaitScreen(msg){
  const t = T[pInfo.team];
  draw(`<div class="huge">${t[0]}</div><h1>${pInfo.name}님 (${t[1]})</h1><div class="card"><p class="sub">${msg}</p></div>`);
}

function renderPlayerStateView(){
  if(!currentRoom) return;
  const ph = currentRoom.ph, gKey = currentRoom.g;
  if(ph === "lobby") renderPlayerWaitScreen("대기 중입니다. 큰 화면을 보세요!");
  else if(ph === "count") draw(`<h1>${G[gKey].e} ${G[gKey].n}</h1><div class="huge">🔥</div><h2>준비하세요!</h2>`);
  else if(ph === "play") runPlayerGameUI(gKey);
  else if(ph === "result") { clearInterval(pTimer); draw(`<div class="huge">🎉</div><h1>경기 종료!</h1><p class="sub">큰 화면에서 순위를 확인하세요!</p>`); }
}

function runPlayerGameUI(gKey){
  pScore = 0; pStopped = false; pT0 = performance.now();
  if(gKey === "tap"){
    draw(`<h2>👆 연타왕</h2><button class="btn pad" id="b-tap">터치!! <div id="cnt" style="font-size:3.5rem">0</div></button>`);
    document.getElementById("b-tap").onpointerdown = (e) => {
      e.preventDefault();
      pScore++;
      document.getElementById("cnt").textContent = pScore;
      socket.emit("PLAYER_SCORE", { val: pScore });
    };
  } else if(gKey === "stop"){
    draw(`<h2>⏱️ 10초를 멈춰라</h2><div class="huge" id="clock" style="font-size:4rem">0.00</div><button class="btn big pad ok" id="b-stop">🛑 STOP!</button>`);
    document.getElementById("b-stop").onpointerdown = (e) => {
      e.preventDefault();
      if(pStopped) return;
      pStopped = true;
      const diff = Math.abs(((performance.now() - pT0) / 1000) - 10);
      socket.emit("PLAYER_SCORE", { val: diff });
      draw(`<div class="huge">🎯</div><h1>${diff.toFixed(2)}초 차이!</h1><p class="sub">결과 발표 대기 중...</p>`);
    };
    clearInterval(pTimer);
    pTimer = setInterval(() => {
      const elapsed = (performance.now() - pT0) / 1000;
      const el = document.getElementById("clock");
      if(el && !pStopped) el.textContent = elapsed < 3 ? elapsed.toFixed(2) : "??.??";
    }, 50);
  }
}
</script>
</body>
</html>
