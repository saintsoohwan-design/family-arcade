<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연타왕 단독 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#4a3b5c;--pop:#ff8fab}
body{background:var(--bg);color:var(--ink);font-family:"Jua",sans-serif;text-align:center;margin:0;padding:20px;touch-action:manipulation}
#app{max-width:500px;margin:0 auto;padding:20px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:20px;margin-top:20px;box-shadow:0 6px 0 var(--ink)}
.pad{height:50vh;width:100%;font-size:2.5rem;border:4px solid var(--ink);background:var(--pop);color:#fff;border-radius:24px;cursor:pointer;box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,0.2)}
.pad:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
h1{font-size:2.5rem;margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <h1>👆 연타왕 단독 테스트</h1>
  <p style="color:#8a7a9b;font-size:1.2rem;">버튼을 마구 연타해 보세요!</p>
  <div class="card">
    <button class="pad" id="b-tap">
      터치!!<br>
      <div id="cnt" style="font-size:5rem;margin-top:10px;">0</div>
    </button>
  </div>
  <button onclick="location.reload()" style="margin-top:20px;font:inherit;padding:10px 20px;border-radius:12px;border:2px solid var(--ink);background:#6ec6ff;color:#fff;cursor:pointer;">초기화</button>
</div>

<script>
let score = 0;
const btn = document.getElementById("b-tap");
const cnt = document.getElementById("cnt");

btn.onpointerdown = (e) => {
  e.preventDefault();
  score++;
  cnt.textContent = score;
};
</script>
</body>
</html>
