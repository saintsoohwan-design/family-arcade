<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 팀 오락실 (P2P 멀티)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#4a3b5c;--pop:#ff8fab;--ok:#7ed957;--alt:#6ec6ff}
body{background:var(--bg);color:var(--ink);font-family:"Jua",sans-serif;text-align:center;margin:0;padding:15px;touch-action:manipulation}
#app{max-width:700px;margin:0 auto;padding:10px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 0 var(--ink)}
.btn{font:inherit;font-size:1.2rem;border:4px solid var(--ink);background:var(--pop);color:#fff;border-radius:18px;padding:12px 20px;cursor:pointer;margin:6px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ok{background:var(--ok)}.btn.alt{background:var(--alt)}.btn.big{font-size:1.5rem;padding:16px;width:100%;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.team{border-radius:18px;padding:10px;border:3px solid var(--ink);color:#fff;text-align:left;font-size:1rem}
.team b{display:block;font-size:1.3rem;text-align:center}
.team .plist{margin-top:6px;font-size:0.85rem;background:rgba(0,0,0,0.15);border-radius:10px;padding:4px;min-height:36px}
.member-tag{display:inline-block;background:rgba(255,255,255,0.3);border-radius:6px;padding:2px 5px;margin:2px}
.pick{opacity:0.5;cursor:pointer}.pick.on{opacity:1;transform:scale(1.03);border-width:4px}
.huge{font-size:4.5rem;margin:10px 0}
input{font:inherit;font-size:1.2rem;border:3px solid var(--ink);border-radius:14px;padding:8px;width:80%;text-align:center;background:var(--card);color:var(--ink)}
.pad{height:40vh;width:100%;font-size:2.2rem}
.badge{background:#4a3b5c;color:#fff;border-radius:10px;padding:4px 10px;font-size:1rem;display:inline-block}
#qr-box{display:flex;justify-content:center;margin:10px 0}
#qr-box img,#qr-box canvas{border:3px solid var(--ink);border-radius:12px;padding:6px;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const T = [["🐰","토끼팀","#ff8fab"],["🐻","곰팀","#ffb347"],["🐸","개구리팀","#6fcf4f"],["🐧","펭귄팀","#5bb8f5"]];
const G = {
  tap: {n:"연타왕", e:"👆", d:10, h:"빠르게 연타하세요!"},
  stop:{n:"10초 멈춰라", e:"⏱️", d:14, h:"정확히 10초에 STOP!"}
};

const app = document.getElementById("app");
const draw = html => { app.innerHTML = html; };
const urlParams = new URLSearchParams(location.search);
const hostId = urlParams.get("host");

let peer = null, conn = null, connections = [];
let isHost = false, players = {}, scores = {}, myInfo = {name:"", team:null};

if(hostId) {
  // 참가자 모드
  initClient(hostId);
} else {
  // 메인 홈 모드
  renderHome();
}

function renderHome() {
  draw(`
    <h1>🎈 우리집 팀 오락실</h1>
    <p style="color:#8a7a9b">서버 없는 깃허브 전용 P2P 멀티</p>
    <div class="card">
      <h2>🎤 진행자 (TV/PC)</h2>
      <button class="btn big ok" onclick="startHosting()">방 만들기 (TV 모드)</button>
    </div>
    <div class="card">
      <h2>📱 참가자 (폰)</h2>
      <p style="font-size:0.9rem">TV 화면의 QR코드를 스캔하거나 링크로 접속하세요!</p>
    </div>
  `);
}

function startHosting() {
  isHost = true;
  // 무작위 호스트 ID 생성 (4자리)
  const myCode = Math.floor(1000 + Math.random() * 9000).toString();
  peer = new Peer("arcade-" + myCode);

  peer.on('open', (id) => {
    renderHostLobby(myCode);
  });

  peer.on('connection', (c) => {
    connections.push(c);
    c.on('data', (data) => {
      if(data.type === 'JOIN') {
        players[c.peer] = { name: data.name, team: data.team };
        scores[c.peer] = 0;
        broadcast({ type: 'ROOM_STATE', players, scores, state: 'lobby' });
        renderHostLobby(myCode);
      } else if(data.type === 'SCORE') {
        scores[c.peer] = data.score;
        broadcast({ type: 'SCORES_UPDATE', scores });
        renderHostLobby(myCode);
      }
    });
  });
}

function broadcast(data) {
  connections.forEach(c => c.send(data));
}

function renderHostLobby(code) {
  const pCount = Object.keys(players).length;
  const roster = T.map((t, idx) => {
    const m = Object.values(players).filter(p => p.team === idx);
    const list = m.map(x => `<span class="member-tag">🟢 ${x.name}</span>`).join("") || `<span style="font-size:0.8rem;color:#8a7a9b">대기 중</span>`;
    return `<div class="team" style="background:${t[2]}"><b>${t[0]} ${t[1]} (${m.length})</b><div class="plist">${list}</div></div>`;
  }).join("");

  const joinUrl = `${location.origin}${location.pathname}?host=arcade-${code}`;
  draw(`
    <h1>🎈 대기실 (방 코드: ${code})</h1>
    <div class="card"><div id="qr-box"></div><p style="font-size:0.75rem;word-break:break-all;">${joinUrl}</p></div>
    <div class="grid">${roster}</div>
    <h2 style="margin:10px 0;">🎮 게임 선택</h2>
    <div class="grid">${Object.entries(G).map(([k, g]) => `<button class="btn" onclick="hostStartGame('${k}', ${g.d})">${g.e} ${g.n}</button>`).join("")}</div>
  `);
  const qrBox = document.getElementById("qr-box");
  if(qrBox){ qrBox.innerHTML = ""; new QRCode(qrBox, { text: joinUrl, width: 120, height: 120 }); }
}

function hostStartGame(gKey, duration) {
  broadcast({ type: 'START_GAME', game: gKey, duration });
  runHostGameView(gKey, duration);
}

function runHostGameView(gKey, duration) {
  let left = duration;
  draw(`<h1>${G[gKey].e} ${G[gKey].n}</h1><div class="card"><h2>남은 시간: <span id="t-left">${left}</span>초</h2><div id="board"></div></div>`);
  
  let timer = setInterval(() => {
    left--;
    const el = document.getElementById("t-left");
    if(el) el.textContent = left;
    if(left <= 0) {
      clearInterval(timer);
      broadcast({ type: 'GAME_OVER' });
      draw(`<h1>🎉 경기 종료!</h1><button class="btn ok big" onclick="location.reload()">처음으로</button>`);
    }
  }, 1000);
}

// --- 참가자(클라이언트) 로직 ---
function initClient(hostPeerId) {
  peer = new Peer();
  peer.on('open', () => {
    renderJoinScreen(hostPeerId);
  });
}

function renderJoinScreen(hostPeerId) {
  draw(`
    <h1>📱 참가자 등록</h1>
    <div class="card">
      <input type="text" id="inp-name" placeholder="닉네임" maxlength="8"><br><br>
      <h2>팀 선택</h2>
      <div class="grid">${T.map((t, i) => `<div class="team pick" data-t="${i}" style="background:${t[2]}" onclick="selectTeam(${i}, this)"><b>${t[0]} ${t[1]}</b></div>`).join("")}</div><br>
      <button class="btn ok big" onclick="connectToHost('${hostPeerId}')">입장하기</button>
    </div>
  `);
}

function selectTeam(idx, el) {
  myInfo.team = idx;
  document.querySelectorAll(".pick").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
}

function connectToHost(hostPeerId) {
  myInfo.name = document.getElementById("inp-name").value.trim();
  if(!myInfo.name) return alert("닉네임을 입력하세요.");
  if(myInfo.team === null) return alert("팀을 선택하세요.");

  conn = peer.connect(hostPeerId);
  conn.on('open', () => {
    conn.send({ type: 'JOIN', name: myInfo.name, team: myInfo.team });
    renderPlayerWait();
  });

  conn.on('data', (data) => {
    if(data.type === 'START_GAME') {
      runClientGame(data.game);
    } else if(data.type === 'GAME_OVER') {
      draw(`<div class="huge">🎉</div><h1>경기 종료!</h1><p>TV 화면을 확인하세요!</p>`);
    }
  });
}

function renderPlayerWait() {
  const t = T[myInfo.team];
  draw(`<div class="huge">${t[0]}</div><h1>${myInfo.name} (${t[1]})</h1><div class="card"><p>연결 완료! 대기 중...</p></div>`);
}

function runClientGame(gKey) {
  let score = 0;
  if(gKey === 'tap') {
    draw(`<h2>👆 연타왕</h2><button class="btn pad" onclick="score++; document.getElementById('cnt').textContent=score; conn.send({type:'SCORE', score});">터치!! <div id="cnt" style="font-size:3.5rem">0</div></button>`);
  } else if(gKey === 'stop') {
    let t0 = performance.now(), stopped = false;
    draw(`<h2>⏱️ 10초 멈춰라</h2><div class="huge" id="clock">0.00</div><button class="btn ok big pad" id="b-stop">STOP!</button>`);
    let timer = setInterval(() => {
      let el = (performance.now() - t0)/1000;
      if(!stopped) document.getElementById("clock").textContent = el < 3 ? el.toFixed(2) : "??.??";
    }, 50);
    document.getElementById("b-stop").onclick = () => {
      if(stopped) return;
      stopped = true;
      clearInterval(timer);
      let diff = Math.abs(((performance.now() - t0)/1000) - 10);
      conn.send({ type: 'SCORE', score: diff });
      draw(`<div class="huge">🎯</div><h1>${diff.toFixed(2)}초 차이!</h1>`);
    };
  }
}
</script>
</body>
</html>
