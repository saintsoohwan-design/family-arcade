<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 팀 오락실 (10종)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#4a3b5c;--pop:#ff8fab;--ok:#7ed957;--alt:#6ec6ff}
body{background:var(--bg);color:var(--ink);font-family:"Jua",sans-serif;text-align:center;margin:0;padding:15px;touch-action:manipulation}
#app{max-width:700px;margin:0 auto;padding:10px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 0 var(--ink)}
.btn{font:inherit;font-size:1.1rem;border:4px solid var(--ink);background:var(--pop);color:#fff;border-radius:18px;padding:10px 16px;cursor:pointer;margin:4px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ok{background:var(--ok)}.btn.alt{background:var(--alt)}.btn.big{font-size:1.4rem;padding:14px;width:100%;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.team{border-radius:18px;padding:10px;border:3px solid var(--ink);color:#fff;text-align:left;font-size:1rem}
.team b{display:block;font-size:1.3rem;text-align:center}
.team .plist{margin-top:6px;font-size:0.85rem;background:rgba(0,0,0,0.15);border-radius:10px;padding:4px;min-height:36px}
.member-tag{display:inline-block;background:rgba(255,255,255,0.3);border-radius:6px;padding:2px 5px;margin:2px}
.pick{opacity:0.5;cursor:pointer}.pick.on{opacity:1;transform:scale(1.03);border-width:4px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;text-align:left}
.bar .nm{width:110px;flex:none}
.bar .tr{flex:1;background:rgba(0,0,0,0.08);border-radius:99px;height:24px;overflow:hidden;border:2px solid var(--ink)}
.bar .fl{height:100%;border-radius:99px}
.bar .v{width:70px;text-align:right;font-weight:700}
.huge{font-size:4rem;margin:10px 0}
input{font:inherit;font-size:1.2rem;border:3px solid var(--ink);border-radius:14px;padding:8px;width:80%;text-align:center;background:var(--card);color:var(--ink)}
.pad{height:40vh;width:100%;font-size:2.2rem}
.badge{background:#4a3b5c;color:#fff;border-radius:10px;padding:4px 10px;font-size:1rem;display:inline-block}
#qr-box{display:flex;justify-content:center;margin:10px 0}
#qr-box img,#qr-box canvas{border:3px solid var(--ink);border-radius:12px;padding:6px;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const T = [["🐰","토끼팀","#ff8fab"],["🐻","곰팀","#ffb347"],["🐸","개구리팀","#6fcf4f"],["🐧","펭귄팀","#5bb8f5"]];
const G = {
  tap: {n:"연타왕", e:"👆", d:10, h:"빠르게 연타하세요!"},
  stop:{n:"10초 멈춰라", e:"⏱️", d:10, h:"정확히 10초에 STOP!"},
  run: {n:"번갈아 달리기", e:"🏃", d:10, h:"좌우 발판을 번갈아 터치!"},
  bal: {n:"풍선 터뜨리기", e:"🎈", d:10, h:"연타해서 풍선을 불어라!"},
  tar: {n:"정중앙 타격", e:"🎯", d:10, h:"타이밍에 맞춰 터치!"},
  rev: {n:"좌우반전 터치", e:"🔄", d:10, h:"지시에 맞춰 누르기!"},
  spd: {n:"빛의 속도 반응", e:"⚡", d:10, h:"신호가 오면 즉시 터치!"},
  num: {n:"숫자 순서대로", e:"🔢", d:10, h:"1부터 5까지 순서대로!"},
  crd: {n:"행운의 동전", e:"🍀", d:10, h:"앞/뒤 맞추기 연타!"},
  rsp: {n:"가위바위보 연타", e:"🪨", d:10, h:"이기는 손을 빠르게 연타!"}
};

const app = document.getElementById("app");
const draw = html => { app.innerHTML = html; };
const urlParams = new URLSearchParams(location.search);
const hostId = urlParams.get("host");

let peer = null, conn = null, connections = [];
let isHost = false, players = {}, scores = {}, myInfo = {name:"", team:null};

if(hostId) {
  initClient(hostId);
} else {
  renderHome();
}

function renderHome() {
  draw(`
    <h1>🎈 우리집 팀 오락실</h1>
    <p style="color:#8a7a9b">미니게임 10종 실시간 멀티</p>
    <div class="card">
      <h2>🎤 진행자 (TV/PC)</h2>
      <button class="btn big ok" onclick="startHosting()">방 만들기 (TV 모드)</button>
    </div>
  `);
}

function startHosting() {
  isHost = true;
  const myCode = Math.floor(1000 + Math.random() * 9000).toString();
  peer = new Peer("arcade-" + myCode);

  peer.on('open', (id) => {
    renderHostLobby(myCode);
  });

  peer.on('connection', (c) => {
    connections.push(c);
    c.on('data', (data) => {
      if(data.type === 'JOIN') {
        players[c.peer] = { name: data.name, team: data.team };
        scores[c.peer] = 0;
        broadcast({ type: 'ROOM_STATE', players, scores });
        renderHostLobby(myCode);
      } else if(data.type === 'SCORE') {
        scores[c.peer] = data.score;
        if(currentHostGame) updateHostScoreBoard(currentHostGame);
      }
    });
    c.on('close', () => {
      delete players[c.peer];
      delete scores[c.peer];
      renderHostLobby(myCode);
    });
  });
}

function broadcast(data) {
  connections.forEach(c => { if(c.open) c.send(data); });
}

function renderHostLobby(code) {
  const pCount = Object.keys(players).length;
  const roster = T.map((t, idx) => {
    const m = Object.values(players).filter(p => p.team === idx);
    const list = m.map(x => `<span class="member-tag">🟢 ${x.name}</span>`).join("") || `<span style="font-size:0.8rem;color:#8a7a9b">대기 중</span>`;
    return `<div class="team" style="background:${t[2]}"><b>${t[0]} ${t[1]} (${m.length})</b><div class="plist">${list}</div></div>`;
  }).join("");

  const joinUrl = `${location.origin}${location.pathname}?host=arcade-${code}`;
  draw(`
    <h1>🎈 대기실 (방 코드: ${code})</h1>
    <div class="card"><div id="qr-box"></div><p style="font-size:0.75rem;word-break:break-all;">${joinUrl}</p></div>
    <div class="grid">${roster}</div>
    <h2 style="margin:10px 0;">🎮 게임 선택 (10종)</h2>
    <div class="grid">${Object.entries(G).map(([k, g]) => `<button class="btn" onclick="hostStartGame('${k}', ${g.d})">${g.e} ${g.n}</button>`).join("")}</div>
  `);
  const qrBox = document.getElementById("qr-box");
  if(qrBox){ qrBox.innerHTML = ""; new QRCode(qrBox, { text: joinUrl, width: 120, height: 120 }); }
}

let currentHostGame = null;
function hostStartGame(gKey, duration) {
  currentHostGame = gKey;
  scores = {};
  Object.keys(players).forEach(pId => scores[pId] = 0);
  broadcast({ type: 'START_GAME', game: gKey, duration });
  runHostGameView(gKey, duration, code => renderHostLobby(code));
}

function runHostGameView(gKey, duration) {
  let left = duration;
  draw(`<h1>${G[gKey].e} ${G[gKey].n}</h1><div class="card"><h2>남은 시간: <span id="t-left">${left}</span>초</h2><div id="board">${renderBars(gKey)}</div></div>`);
  
  let timer = setInterval(() => {
    left--;
    const el = document.getElementById("t-left");
    if(el) el.textContent = left;
    if(left <= 0) {
      clearInterval(timer);
      currentHostGame = null;
      broadcast({ type: 'GAME_OVER' });
      draw(`<h1>🎉 경기 결과</h1><div class="card">${renderBars(gKey)}</div><button class="btn ok big" onclick="peer ? renderHostLobby(peer.id.replace('arcade-','')) : location.reload()">대기실로 돌아가기 ▶</button>`);
    }
  }, 1000);
}

function updateHostScoreBoard(gKey) {
  const board = document.getElementById("board");
  if(board) board.innerHTML = renderBars(gKey);
}

function renderBars(gKey) {
  const r = T.map((_, i) => {
    const m = Object.entries(players).filter(([_, p]) => p.team === i);
    if(!m.length) return [i, null];
    const sum = m.reduce((acc, [pId]) => acc + (scores[pId] ?? (gKey === "stop" ? 10 : 0)), 0);
    return [i, sum / m.length];
  }).filter(x => x[1] !== null).sort((a,b) => gKey === "stop" ? a[1]-b[1] : b[1]-a[1]);

  if(!r.length) return `<p>참가팀 대기 중...</p>`;
  const maxV = Math.max(1, ...r.map(x => gKey === "stop" ? 10 : x[1]));
  return r.map((x, idx) => {
    const t = T[x[0]];
    const w = gKey === "stop" ? Math.max(8, 100 - x[1]*10) : Math.max(8, (x[1]/maxV)*100);
    const txt = gKey === "stop" ? x[1].toFixed(2) + "초" : Math.round(x[1]) + "점";
    return `<div class="bar"><span class="nm">${idx===0?"👑 ":""}${t[0]}</span><div class="tr"><div class="fl" style="width:${w}%;background:${t[2]}"></div></div><span class="v">${txt}</span></div>`;
  }).join("");
}

// --- 참가자(클라이언트) 로직 ---
function initClient(hostPeerId) {
  peer = new Peer();
  peer.on('open', () => { renderJoinScreen(hostPeerId); });
}

function renderJoinScreen(hostPeerId) {
  draw(`
    <h1>📱 참가자 등록</h1>
    <div class="card">
      <input type="text" id="inp-name" placeholder="닉네임" maxlength="8"><br><br>
      <h2>팀 선택</h2>
      <div class="grid">${T.map((t, i) => `<div class="team pick" data-t="${i}" style="background:${t[2]}" onclick="selectTeam(${i}, this)"><b>${t[0]} ${t[1]}</b></div>`).join("")}</div><br>
      <button class="btn ok big" onclick="connectToHost('${hostPeerId}')">입장하기</button>
    </div>
  `);
}

function selectTeam(idx, el) {
  myInfo.team = idx;
  document.querySelectorAll(".pick").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
}

function connectToHost(hostPeerId) {
  myInfo.name = document.getElementById("inp-name").value.trim();
  if(!myInfo.name) return alert("닉네임을 입력하세요.");
  if(myInfo.team === null) return alert("팀을 선택하세요.");

  conn = peer.connect(hostPeerId);
  conn.on('open', () => {
    conn.send({ type: 'JOIN', name: myInfo.name, team: myInfo.team });
    renderPlayerWait();
  });

  conn.on('data', (data) => {
    if(data.type === 'START_GAME') {
      runClientGame(data.game);
    } else if(data.type === 'GAME_OVER') {
      renderPlayerWait();
    }
  });
}

function renderPlayerWait() {
  const t = T[myInfo.team];
  draw(`<div class="huge">${t[0]}</div><h1>${myInfo.name} (${t[1]})</h1><div class="card"><p>게임 대기 중입니다! TV 화면을 보세요.</p></div>`);
}

function runClientGame(gKey) {
  let score = 0;
  draw(`<h2>${G[gKey].e} ${G[gKey].n}</h2><button class="btn pad" id="b-act">터치!! <div id="cnt" style="font-size:3rem">0</div></button>`);
  document.getElementById("b-act").onpointerdown = (e) => {
    e.preventDefault();
    score++;
    document.getElementById("cnt").textContent = score;
    if(conn && conn.open) conn.send({ type: 'SCORE', score });
  };
}
</script>
</body>
</html>
